<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1420" />
    <title>Offline · DUO</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120e18;
        color: #fff4e6;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 26px;
      }
      p {
        margin: 0;
        max-width: 320px;
        color: #c9bfd2;
        line-height: 1.5;
      }
      a {
        margin-top: 10px;
        padding: 12px 22px;
        border-radius: 999px;
        background: linear-gradient(90deg, #ff8a6e, #a593ff);
        color: #120e18;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>DUO needs a connection for calls and chat. Check your Wi-Fi or mobile data, then try again.</p>
      <a href="/home">Try again</a>
    </main>
  </body>
</html>
